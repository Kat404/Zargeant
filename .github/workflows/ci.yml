name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: zig build test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux-only: src/api_client.zig and tools/debug_call.zig use
        # std.os.linux.* raw syscalls (Landlock + Seccomp-BPF for sandbox,
        # direct socket calls for the MiniMax HTTP-SSE client). The
        # comptime guards @compileError on non-Linux targets. README
        # section "Requirements" + roadmap/decisions id=192 confirm this
        # is intentional. macOS support is a roadmap follow-up (see
        # "logger-macos-port" + "sandbox-macos" rows in the project table).
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache zig build cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-

      - name: Show toolchain
        run: zig version

      - name: "Strict QA verify (compile-first, QA 0..6)"
        run: zig build verify

      - name: Verify no Co-Authored-By AI in commits
        run: |
          if git log --format='%B' origin/main..HEAD | grep -iE 'Co-Authored-By:.*(Claude|MiniMax|Anthropic|AI)'; then
            echo "::error::Found Co-Authored-By AI line in commit message"
            exit 1
          fi

  strict-tdd:
    name: Strict TDD check (no production code without tests)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Verify every src/*.zig has test blocks
        run: |
          missing=""
          for f in src/*.zig; do
            tests=$(grep -c '^test ' "$f" || true)
            if [ "$tests" -eq 0 ]; then
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Sources without tests:$missing"
            exit 1
          fi
          echo "OK: all src/*.zig have test blocks"
